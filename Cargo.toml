[package]
name = "bevy_pages"
version = "0.4.0"
edition = "2024"
authors = ["Mikail Plotzky <mp@ypon.com>"]
description = "Upgrade your Bevy UI experience with XML and an extended widget collection."
keywords = ["bevy", "ui", "xml"]
categories = ["game-development", "gui"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/drafteddev/bevy_pages"
documentation = "https://docs.rs/bevy_pages"

[dependencies]
roxmltree = "0.21.1"
rustc-hash = "2.1.3"
smol_str = "0.3.6"
bevy = {
    version = "0.19.0",
    default-features = false,
    features = ["bevy_ui", "bevy_ui_widgets", "bevy_asset", "ui_picking"]
}

[features]
default = []

# Enables asset hot-reloading
hot-reload = ["bevy/file_watcher"]

# Enables bevy's `debug` feature
debug = ["bevy/debug"]

[dev-dependencies]
bevy = "0.19.0"

[[example]]
name = "counter"
path = "examples/counter.rs"
harness = false

[[example]]
name = "showcase"
path = "examples/showcase.rs"
harness = false

[[example]]
name = "multi_page"
path = "examples/multi_page.rs"
harness = false
